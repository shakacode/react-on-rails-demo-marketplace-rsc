aliases:
  common: &common
    cpln_org: shakacode-open-source-examples-staging
    default_location: aws-us-east-2
    one_off_workload: rails
    app_workloads:
      - rails
    additional_workloads: []
    fix_terminal_size: true
    image_retention_days: 30

apps:
  react-server-components-demo:
    <<: *common
    release_script: rails db:migrate
    secrets_name: react-server-components-demo-secrets
    setup_app_templates:
      - app
      - rails

  react-server-components-demo-review:
    <<: *common
    match_if_app_name_starts_with: true
    # Required by `cpflow cleanup-stale-apps` (the nightly Cleanup Stale Review
    # Apps workflow): a review app whose latest image is at least this many days
    # old gets deleted. Without it the command exits 64 — which silently failed
    # every nightly run from 2026-05-31 to 2026-09-03.
    stale_app_image_deployed_days: 7
    # release_script intentionally omitted: review apps share the persistent
    # demo DB. Migrating here would mutate schema for other review apps.
    secrets_name: react-server-components-demo-secrets
    secrets_policy_name: react-server-components-demo-secrets-policy
    # Primary app secret settings above make new review apps use the persistent
    # demo dictionary. The shared grant lets cpflow 5.1 repair existing review
    # app identities on deploy-image.
    shared_secret_grants:
      - name: app_secrets
        secret_name: react-server-components-demo-secrets
        policy_name: react-server-components-demo-secrets-policy
    setup_app_templates:
      - app
      - rails
