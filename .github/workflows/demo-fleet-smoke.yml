name: Demo fleet smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    uses: shakacode/react_on_rails/.github/workflows/demo-fleet-smoke.yml@40a8cd1e9e1da4f4b0dfc961482ea3b9086bf302
    with:
      ruby-version: "3.4.6"
      node-version: "22.22.3"
      install-command: >-
        bundle config set path vendor/bundle && bundle install --jobs 4 --retry 3 &&
        corepack enable && corepack pnpm@9.15.2 install --frozen-lockfile
      test-command: bundle exec rake
      build-command: SECRET_KEY_BASE=dummy_secret_key_base_for_demo_fleet bin/build-production
      smoke-command: pnpm lint:rsc && pnpm verify:rsc
