name: Demo fleet smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-fleet-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    uses: shakacode/react_on_rails/.github/workflows/demo-fleet-smoke.yml@8978c0d820c006c1f02306f915f5cfba32fa3f42
    with:
      ruby-version: "3.4.6"
      node-version: "22.22.3"
      install-command: >-
        bundle config set path vendor/bundle && bundle install --jobs 4 --retry 3 &&
        corepack enable && corepack pnpm@9.15.2 install --frozen-lockfile
      test-command: bundle exec rake
      build-command: SECRET_KEY_BASE=dummy_secret_key_base_for_demo_fleet bin/build-production
      smoke-command: pnpm lint:rsc && pnpm verify:rsc

  # Always-emitting, locally-owned result for the required-checks gate (#206).
  # Required contexts must have names this repo controls: the check name the
  # reusable workflow emits ("smoke / Demo fleet smoke") belongs to
  # react_on_rails, and a pin bump that renames the inner job would make a
  # required context silently never report again — wedging every PR. This
  # job's name is ours and stable. See docs/ci-required-checks.md.
  demo-fleet-smoke-result:
    needs: [smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless the fleet smoke succeeded
        env:
          RESULT: ${{ needs.smoke.result }}
        run: |
          echo "Demo fleet smoke result: ${RESULT}"
          [[ "${RESULT}" == "success" ]]
