name: Browser Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/localhub_demo_smoke
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      RENDERER_LOG_LEVEL: warn
      RENDERER_PASSWORD: development_password
      SECRET_KEY_BASE: test123

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Prepare database
        run: bin/rails db:prepare db:seed

      - name: Build production assets
        run: bin/build-production

      - name: Start browser-smoke servers
        shell: bash
        env:
          NODE_ENV: production
          RENDERER_PORT: 3800
        run: |
          node node-renderer.js > /tmp/marketplace-renderer.log 2>&1 &
          renderer_pid=$!
          bundle exec rails server -b 127.0.0.1 -p 3010 > /tmp/marketplace-rails.log 2>&1 &
          rails_pid=$!

          for _ in {1..60}; do
            if ! kill -0 "$renderer_pid" 2>/dev/null; then
              echo "Node renderer exited before becoming ready"
              cat /tmp/marketplace-renderer.log
              exit 1
            fi

            if ! kill -0 "$rails_pid" 2>/dev/null; then
              echo "Rails exited before becoming ready"
              cat /tmp/marketplace-rails.log
              exit 1
            fi

            rails_ready=false
            renderer_ready=false

            if curl -fsS http://127.0.0.1:3010/up >/dev/null; then
              rails_ready=true
            fi

            if curl -sS --max-time 1 -o /dev/null "http://127.0.0.1:${RENDERER_PORT}/"; then
              renderer_ready=true
            fi

            if [[ "$rails_ready" == "true" && "$renderer_ready" == "true" ]]; then
              exit 0
            fi

            sleep 1
          done

          echo "Rails and Node renderer did not become ready in time"
          cat /tmp/marketplace-renderer.log
          cat /tmp/marketplace-rails.log
          exit 1

      - name: Smoke real routes in Chromium
        env:
          BASE_URL: http://127.0.0.1:3010
        run: pnpm smoke:routes
