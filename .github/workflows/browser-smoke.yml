name: Browser Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/localhub_demo_smoke
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      RENDERER_LOG_LEVEL: warn

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f
        with:
          ruby-version: "3.3.0"
          bundler-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Generate smoke credentials
        shell: bash
        run: |
          {
            echo "SECRET_KEY_BASE=$(openssl rand -hex 64)"
            echo "RENDERER_PASSWORD=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Prepare database
        # In production mode, db:prepare seeds a newly-created database. Running
        # db:seed again duplicates order numbers and fails the smoke setup.
        run: bin/rails db:prepare

      - name: Build production assets
        run: bin/build-production

      - name: Start browser-smoke servers
        shell: bash
        env:
          NODE_ENV: production
          RENDERER_PORT: 3800
        run: |
          node node-renderer.js > /tmp/marketplace-renderer.log 2>&1 &
          renderer_pid=$!
          bundle exec rails server -b 127.0.0.1 -p 3010 > /tmp/marketplace-rails.log 2>&1 &
          rails_pid=$!

          for _ in {1..60}; do
            if ! kill -0 "$renderer_pid" 2>/dev/null; then
              echo "Node renderer exited before becoming ready"
              cat /tmp/marketplace-renderer.log
              exit 1
            fi

            if ! kill -0 "$rails_pid" 2>/dev/null; then
              echo "Rails exited before becoming ready"
              cat /tmp/marketplace-rails.log
              exit 1
            fi

            rails_ready=false
            renderer_ready=false

            if curl -fsS http://127.0.0.1:3010/up >/dev/null; then
              rails_ready=true
            fi

            if (: >"/dev/tcp/127.0.0.1/${RENDERER_PORT}") 2>/dev/null; then
              renderer_ready=true
            fi

            if [[ "$rails_ready" == "true" && "$renderer_ready" == "true" ]]; then
              exit 0
            fi

            sleep 1
          done

          echo "Rails and Node renderer did not become ready in time"
          cat /tmp/marketplace-renderer.log
          cat /tmp/marketplace-rails.log
          exit 1

      - name: Smoke real routes in Chromium
        env:
          BASE_URL: http://127.0.0.1:3010
        run: pnpm smoke:routes
