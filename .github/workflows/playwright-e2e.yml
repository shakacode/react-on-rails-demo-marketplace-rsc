name: Playwright E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      CI: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/localhub_demo_playwright
      RAILS_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Write Ruby version file
        shell: bash
        run: |
          ruby_version="$(awk -F'"' '/^[[:space:]]*ruby[[:space:]]*=/ { print $2; exit }' mise.toml)"
          if [[ -z "${ruby_version}" ]]; then
            echo "::error::Could not read Ruby version from mise.toml"
            exit 1
          fi
          printf '%s\n' "${ruby_version}" > .ruby-version

      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Playwright types and lint
        run: pnpm type-check:e2e && pnpm lint:e2e && pnpm test:e2e:unit

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare test database
        run: bin/rails db:prepare

      - name: Verify the Rails command bridge contract
        run: bundle exec rspec e2e/playwright_foundation_spec.rb

      - name: Run the product-search browser journey
        run: pnpm test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-failure-artifacts
          path: |
            e2e/playwright-report/
            e2e/server-logs/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
