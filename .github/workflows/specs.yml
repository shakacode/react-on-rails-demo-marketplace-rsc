name: RSpec request & routing specs

# Fast safety net for ordinary app-level changes — runs on every PR that touches
# Ruby/config/spec paths, and again on push to main as a post-merge gate.
# The existing browser
# gates prove the pages render and hydrate, but both need the full toolchain:
# browser-smoke.yml builds production assets and boots Rails + the Node renderer
# (~20 min), and rsc-rspack-e2e.yml additionally builds the Pro packages from
# source (~40 min, narrow path triggers). This job needs only Ruby + Postgres —
# no pnpm, no webpack build, no Node renderer — so a controller / helper /
# route / serializer regression fails CI in seconds instead of tens of minutes.
#
# It GETs every renderer-free route (marketing pages, redirects, health, the
# JSON API) and asserts each feature route still dispatches to the right
# controller#action. Render + hydration of the React pages stays with the
# browser gates; see spec/routing/routes_spec.rb for that split.
#
# The suite is deliberately NOT wired into `bundle exec rake` — see the comment
# in the Rakefile for why.
#
# Required-check conversion (#206): `rspec-result` below is a required status
# check on main. A required check must be ALWAYS-EMITTING — if a workflow-level
# `paths:` filter stops the workflow from running at all, GitHub waits for the
# missing check forever and the PR can never merge. So on pull_request this
# workflow always starts, a cheap `detect-changes` job decides whether the diff
# is Ruby-relevant, the real `rspec` job is skipped when it is not, and
# `rspec-result` reports success ("passed or legitimately nothing to test") or
# failure on every PR. See docs/ci-required-checks.md.
on:
  pull_request:
    # Deliberately NO `paths:` here — the filter moved into the detect-changes
    # job so the required `rspec-result` check emits on every PR (#206).
  push:
    branches: [main]
    # Push runs are not required checks, so the workflow-level filter stays —
    # keep this list in sync with RUBY-RELEVANT PATHS in detect-changes below.
    paths:
      - 'app/**'
      - 'config/**'
      - 'lib/**'
      - 'db/schema.rb'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'spec/**'
      - '.rspec'
      # The browser-route parity spec reads this file's inventory.
      - '.verify-routes.js'
      - '.github/workflows/specs.yml'
      - 'Rakefile'
      - 'bin/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: specs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ruby: ${{ steps.filter.outputs.ruby }}
    steps:
      - name: Decide whether Ruby-relevant paths changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # NOTE: GitHub's default shell is `bash -e {0}` — errexit is ON.
          # `set` below only ADDS options; it does NOT turn -e off. Every
          # fallible command here must stay guarded (if ! / || true / || echo),
          # or one transient API error flips this fail-OPEN detector to
          # fail-CLOSED (red required check on an unrelated PR). See #218.
          set -uo pipefail

          # Non-PR events (push already passed the workflow-level filter;
          # workflow_dispatch is an explicit request): always run the suite.
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "ruby=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Fail OPEN: if the file listing breaks, run the suite. A wasted
          # spec run is cheap; a silently skipped gate is not.
          # Renames matter on BOTH sides: a pure rename OUT of a Ruby-relevant
          # path (lib/foo.rb -> scripts/foo.rb) lists only the new path in
          # .filename — the old path is in .previous_filename. Missing it would
          # green-light a PR whose rename breaks require/routing targets.
          # One TSV line per file entry ("filename<TAB>previous_filename") so
          # the line count below is in the same units as `.changed_files`
          # (files, not names) — renames must not inflate the cap check (#218).
          if ! files=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" \
                         --paginate --jq '.[] | [.filename, (.previous_filename // "")] | @tsv'); then
            echo "Could not list PR files — running specs to be safe."
            echo "ruby=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # The files endpoint silently caps at 3000 entries. If the PR claims
          # more files than we listed, the list is incomplete — fail open too.
          declared=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.changed_files' || echo "")
          listed=$(grep -c . <<< "${files}" || true)
          if [[ -z "${declared}" || "${listed}" -lt "${declared}" ]]; then
            echo "File listing incomplete (${listed}/${declared:-unknown}) — running specs to be safe."
            echo "ruby=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # RUBY-RELEVANT PATHS — keep in sync with the push `paths:` filter
          # at the top of this file. Each line holds one file as
          # "new-name<TAB>old-name" (old name empty unless renamed) — check both.
          ruby=false
          while IFS=$'\t' read -r f prev; do
            for p in "${f}" "${prev}"; do
              case "${p}" in
                app/*|config/*|lib/*|spec/*|bin/*) ruby=true; break 2 ;;
                db/schema.rb|Gemfile|Gemfile.lock|.rspec|.verify-routes.js|Rakefile) ruby=true; break 2 ;;
                .github/workflows/specs.yml) ruby=true; break 2 ;;
              esac
            done
          done <<< "${files}"

          echo "Ruby-relevant change detected: ${ruby}"
          echo "ruby=${ruby}" >> "${GITHUB_OUTPUT}"

  rspec:
    needs: detect-changes
    if: needs.detect-changes.outputs.ruby == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      CI: 'true'
      # host/user/password for the Postgres service; database.yml names the DB.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432

    steps:
      - name: Checkout
        # Pinned to the same immutable SHAs the other workflows in this repo use,
        # so a moved upstream tag cannot change what CI executes.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1
        with:
          bundler-cache: true

      - name: Load test schema
        run: bin/rails db:test:prepare

      - name: Run request & routing specs
        # spec/ppr_production_boot_spec.rb lives outside spec/requests and
        # spec/routing but needs only Ruby (it shells out to `bin/rails
        # runner` in a self-contained production subprocess, no DB access),
        # so it rides along in this fast job instead of getting its own.
        run: bundle exec rspec spec/requests spec/routing spec/workflows spec/ppr_production_boot_spec.rb

  # Always-emitting result for the required-checks gate (#206). This — not
  # `rspec` — is the required context, because it reports on every PR:
  #   - specs ran and passed                          -> success
  #   - nothing Ruby-relevant changed (rspec skipped) -> success
  #   - specs failed/cancelled, or detect-changes
  #     itself broke (which would skip rspec)         -> failure
  # Requiring bare `rspec` instead would count a skip caused by a BROKEN
  # detect job as a pass (GitHub treats skipped-required as success).
  rspec-result:
    needs: [detect-changes, rspec]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless specs succeeded or were legitimately skipped
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          RSPEC_RESULT: ${{ needs.rspec.result }}
          RUBY_CHANGED: ${{ needs.detect-changes.outputs.ruby }}
        run: |
          echo "detect-changes: ${DETECT_RESULT}; rspec: ${RSPEC_RESULT}; ruby-relevant: ${RUBY_CHANGED}"
          if [[ "${RSPEC_RESULT}" == "success" ]]; then
            exit 0
          fi
          if [[ "${DETECT_RESULT}" == "success" && "${RSPEC_RESULT}" == "skipped" && "${RUBY_CHANGED}" == "false" ]]; then
            echo "No Ruby-relevant paths changed — nothing to test."
            exit 0
          fi
          echo "Specs failed or were cancelled, or the change detector itself failed."
          exit 1
