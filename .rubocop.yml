inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rails

AllCops:
  TargetRubyVersion: 3.4
  # Warn about cops added by future RuboCop upgrades without failing this baseline.
  NewCops: pending
  # Avoid the local Prism parser load failure: cannot load such file --
  # prism/translation/parser34.
  ParserEngine: parser_whitequark
  SuggestExtensions: false
  Exclude:
    - node_modules/**/*
    - tmp/**/*
    - vendor/**/*

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Style/FormatStringToken:
  EnforcedStyle: unannotated

Style/SymbolArray:
  EnforcedStyle: percent
  MinSize: 10

# RSpec example groups and the request-spec data builders are long by nature;
# the size metrics target production code, not the spec DSL. `inherit_mode`
# keeps the .rubocop_todo.yml exclusions for these cops intact.
Metrics/BlockLength:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - 'spec/**/*'

Metrics/MethodLength:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - 'spec/**/*'

# The route contract is a declarative inventory of every public GET route, so its
# length tracks the size of the app's route table rather than any complexity worth
# splitting up.
Metrics/ModuleLength:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - 'spec/support/route_contract.rb'
