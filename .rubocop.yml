inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  NewCops: pending
  # Avoid the local Prism parser load failure:
  # cannot load such file -- prism/translation/parser34.
  ParserEngine: parser_whitequark
  SuggestExtensions: false
  Exclude:
    - node_modules/**/*
    - tmp/**/*
    - vendor/**/*
