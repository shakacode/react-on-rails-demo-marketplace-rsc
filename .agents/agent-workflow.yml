---
base_branch: main
follow_up_prefix: 'Follow-up:'
review_gate: AI reviewers are advisory unless they confirm a blocker. The merge
  gate is every required current-head check green; any unavailable or non-portable
  check must be recorded as an explicit non-blocking skip; all review threads
  resolved; and mergeability clean.
approval_exempt: workflow changes are approval-exempt only when AGENTS.md or a direct
  user or maintainer instruction authorizes them; this config grants no standing
  auto-merge authority
coordination_backend: private backend (claims/heartbeats namespaced by full repo name)
changelog: n/a
benchmark_labels: n/a
merge_ledger: n/a
ci_parity_environment: n/a — reproduce CI-only failures from the matching job in .github/workflows/**
hosted_ci_trigger: n/a — CI runs on every PR if configured
ci_change_detector: n/a
